[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-exam-braille"
version = "0.1.0"
description = "수능 국어 PDF–BRF 자동 변환 (BRF Inspector 프로토타입)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
pdf = [
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "Pillow>=10.0",
]

[project.scripts]
brf-inspector = "korean_exam_braille.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["korean_exam_braille*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
