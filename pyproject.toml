[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-exam-braille"
version = "0.1.0"
description = "수능 국어 PDF→BRF 자동 변환 (참고 시각장애용 BRF 정합 목표)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
web = [
    "starlette>=0.38",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
pdf = [
    "pdfplumber>=0.11",
    "Pillow>=10.0",
]

[project.scripts]
brf-inspector = "korean_exam_braille.app.main:main"
pdf-viewer = "korean_exam_braille.app.main:main_pdf"
korean-exam-braille = "korean_exam_braille.app.main:main"
korean-exam-braille-web = "korean_exam_braille.app.web.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["korean_exam_braille*"]

[tool.setuptools.package-data]
"korean_exam_braille.app.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
